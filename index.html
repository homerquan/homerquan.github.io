<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homer Quan</title>
  <meta name="description" content="Homer Quan builds practical deep tech systems across NeuronSymbolic AI, physical models, graph analysis, autonomous robotics, and industrial intelligence." />
  <meta name="keywords" content="Homer Quan, NeuronSymbolic, Physical Models, Graph Analysis, Deep Tech, Smart Manufacturing, Autonomous Robotics, Data-Driven Logistics, Industrial Intelligence" />
  <meta name="author" content="Homer Quan" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Homer Quan | Deep Tech and AI Systems" />
  <meta property="og:description" content="Personal site of Homer Quan focused on NeuronSymbolic AI, robotics, manufacturing, and industrial intelligence." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://homerquan.com/" />
  <style>
    :root {
      --bg: #03050a;
      --text: #e9ecff;
      --muted: #a7b2d4;
      --accent: #9fd4ff;
      --accent-2: #c8f5ff;
      --glass: rgba(8, 14, 30, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #0c1635 0%, var(--bg) 45%, #020308 100%);
      color: var(--text);
      font-family: "Space Grotesk", sans-serif;
    }

    #hero {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #hero canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      pointer-events: auto;
    }

    .card {
      width: min(760px, 92vw);
      border: 1px solid rgba(180, 211, 255, 0.2);
      background: linear-gradient(140deg, var(--glass), rgba(9, 11, 22, 0.46));
      backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: clamp(20px, 3vw, 34px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 14px 0;
      font-size: clamp(2rem, 7vw, 4.8rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f7fbff;
      text-shadow: 0 0 28px rgba(169, 222, 255, 0.22);
      animation: floatTitle 5s ease-in-out infinite;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tag {
      border: 1px solid rgba(173, 235, 255, 0.36);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: clamp(0.78rem, 1.5vw, 0.98rem);
      color: var(--accent-2);
      background: rgba(12, 20, 45, 0.42);
      box-shadow: inset 0 0 10px rgba(159, 212, 255, 0.1);
      animation: drift 6s ease-in-out infinite;
    }

    .tag:nth-child(2n) {
      animation-delay: 0.8s;
    }

    .tag:nth-child(3n) {
      animation-delay: 1.6s;
    }

    .socials {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .socials a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 1px solid transparent;
      transition: border-color 180ms ease, color 180ms ease;
    }

    .socials a:hover {
      color: #e9f9ff;
      border-color: rgba(233, 249, 255, 0.9);
    }

    @keyframes floatTitle {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes drift {
      0%,
      100% {
        transform: translateY(0) scale(1);
        border-color: rgba(173, 235, 255, 0.36);
      }
      50% {
        transform: translateY(-3px) scale(1.02);
        border-color: rgba(216, 248, 255, 0.7);
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/": "https://unpkg.com/three@0.160.0/examples/"
    }
  }
  </script>
  <script type="module" src="script.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Homer Quan",
    "jobTitle": "AI and Deep Tech Leader",
    "description": "Homer Quan focuses on NeuronSymbolic systems, physical models, graph analysis, smart manufacturing, and autonomous robotics.",
    "knowsAbout": [
      "NeuronSymbolic",
      "Physical Models",
      "Graph Analysis",
      "Deep Tech",
      "Smart Manufacturing",
      "Autonomous Robotics",
      "Data-Driven Logistics",
      "Industrial Intelligence"
    ],
    "sameAs": [
      "https://twitter.com/homerquan",
      "https://github.com/homerquan",
      "https://huggingface.co/homerquan"
    ]
  }
  </script>
</head>

<body>
  <div id="hero" aria-hidden="true"></div>
  <main class="overlay">
    <section class="card">
      <h1>Homer Quan</h1>
      <div class="tags" aria-label="Highlighted interests">
        <span class="tag">NeuronSymbolic</span>
        <span class="tag">Physical Models</span>
        <span class="tag">Graph Analysis</span>
        <span class="tag">Deep Tech</span>
        <span class="tag">Smart Manufacturing</span>
        <span class="tag">Autonomous Robotics</span>
        <span class="tag">Data-Driven Logistics</span>
        <span class="tag">Industrial Intelligence</span>
      </div>
      <nav class="socials" aria-label="Social links">
        <a href="https://twitter.com/homerquan" target="_blank" rel="noopener noreferrer">X / Twitter</a>
        <a href="https://github.com/homerquan" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://huggingface.co/homerquan" target="_blank" rel="noopener noreferrer">Hugging Face</a>
        <a href="https://www.linkedin.com/in/homerquan/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </section>
  </main>
</body>

</html>
